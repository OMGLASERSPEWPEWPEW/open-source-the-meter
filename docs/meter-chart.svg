<text class="foot" x="24" y="1124" text-anchor="start"><tspan x="24" dy="0">Weekly usage limit = API-equivalent dollars used in the week, divided by the percent of the week the plan said was used, at the week&#x27;s highest</tspan><tspan x="24" dy="18">reading; when the plan reset a week&#x27;s usage early, only the use before the reset counts. A reset that only sessions which had already shown those low</tspan><tspan x="24" dy="18">percents saw can be missed (a reset after a 100% reading is always right). It is a lower bound: use of the same plan on claude.ai, the desktop app or</tspan><tspan x="24" dy="18">other machines isn&#x27;t in these logs. Weeks with no usable reading are left out (under 20% used, no spend on this machine, spend with no known account,</tspan><tspan x="24" dy="18">or overlapping another week; the ceiling command lists each with its reason). Right after switching accounts, spend counts toward the earlier account</tspan><tspan x="24" dy="18">until a reading shows the new one, so a week next to a switch can read too high or too low.</tspan></text>
<text class="foot" x="24" y="1238" text-anchor="start"><tspan x="24" dy="0">API list prices checked 2026-10-26. Drawn Nov 8, 2026 20:00 UTC.</tspan></text>
<text class="foot" x="24" y="1262" text-anchor="start"><tspan x="24" dy="0">Synthetic data (vectors/cases/07-trends), not anyone&#x27;s real use. Draw yours with: python3 -B -I reference/meter.py chart</tspan></text>
