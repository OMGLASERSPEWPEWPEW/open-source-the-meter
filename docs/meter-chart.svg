roke-linejoin:round}.mp .dot{fill:var(--p-line)}.mp .dot.open{fill:var(--p-plot);stroke:var(--p-line);stroke-width:2.5}.mp .hit{fill:transparent}.mp .val{fill:var(--p-gold);font-size:13px}.mp .xl{fill:var(--p-xl);font-size:12px}.mp .xl.soft{fill:var(--p-tick)}</style>
